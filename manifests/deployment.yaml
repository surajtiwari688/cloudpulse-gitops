apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudpulse-ai-api
  namespace: default
  labels:
    app: cloudpulse-ai-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudpulse-ai-api
  template:
    metadata:
      labels:
        app: cloudpulse-ai-api
    spec:
      containers:
        - name: cloudpulse-api
          image: ghcr.io/surajtiwari688/cloudpulse-ai:cc9ed389e6367bdb021df755cddba9eab96b3218
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: OLLAMA_URL
              value: "http://host.docker.internal:11434"
            - name: OLLAMA_MODEL
              value: "llama3.2:latest"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
